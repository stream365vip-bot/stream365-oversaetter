name: Tjek

on:
  push:
  pull_request:

jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer
        run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.1
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q
      - name: Docker build
        run: docker build -t stream365-oversaetter:test .
      - name: ffmpeg i billedet
        run: docker run --rm stream365-oversaetter:test sh -c "ffmpeg -version | head -1 && ffprobe -version | head -1"
