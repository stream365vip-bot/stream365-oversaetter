# Placeres i /opt/oversaetter sammen med .env
services:
  oversaetter:
    build: .
    image: stream365-oversaetter:latest
    container_name: oversaetter
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      # Kun til testtilstanden oversaet-test. Mangler nøglefilerne, kører driften videre som normalt.
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-/run/secrets/deepseek_api_key}
      GEMINI_API_KEY_FILE: ${GEMINI_API_KEY_FILE:-/run/secrets/gemini_api_key}
      # Valgfri TMDB-nøgle til filmkonteksten (CONTEXT=on). Tom fil = kun Radarr/Sonarr.
      TMDB_API_KEY_FILE: ${TMDB_API_KEY_FILE:-/run/secrets/tmdb_api_key}
    networks:
      - saltbox
    labels:
      com.github.saltbox.saltbox_managed: "true"
    volumes:
      - /mnt/unionfs:/mnt/unionfs
      - /opt/oversaetter/data:/data
      - /opt/lingarr/secrets/anthropic_api_key.txt:/run/secrets/anthropic_api_key:ro
      - /opt/oversaetter/secrets/deepseek_api_key.txt:/run/secrets/deepseek_api_key:ro
      - /opt/oversaetter/secrets/gemini_api_key.txt:/run/secrets/gemini_api_key:ro
      - /opt/oversaetter/secrets/tmdb_api_key.txt:/run/secrets/tmdb_api_key:ro

networks:
  saltbox:
    external: true
